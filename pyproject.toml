[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "worker*"]

[project]
name = "audio-text-manager"
version = "0.1.0"
description = "Offline Whisper transcription and local summarization (FastAPI + worker + browser UI)."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "faster-whisper>=1.0.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff==0.16.4",
  "pre-commit>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "B008",  # FastAPI File()/Form() defaults
  "E501",  # line length; keep readable long strings
  "SIM105",  # rollback/unlink try-except-pass is clearer than suppress
  "RUF001",  # Russian prompt strings look like Latin homoglyphs
  "RUF002",
  "RUF003",
]
